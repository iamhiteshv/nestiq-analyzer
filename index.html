<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestIQ — Behavioral Alpha Analyzer</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a07; --bg2: #080f0a; --bg3: #0d1a10; --surface: #0f1f13;
    --border: #1e3a24; --teal: #00e5a0; --teal2: #00b87a; --teal3: #007a52;
    --red: #ff4d6d; --amber: #ffb830; --text: #e8f5ec; --text2: #8fad98;
    --text3: #4a6655; --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  .noise-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(0,229,160,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,160,0.015) 1px, transparent 1px); background-size: 40px 40px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
  .license-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 480px; margin: 60px auto; }
  .license-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; color: var(--teal); font-family: var(--mono); outline: none; text-transform: uppercase; }
  .btn-primary { width: 100%; background: var(--teal); color: var(--bg); font-weight: 700; padding: 14px; border-radius: 6px; margin-top: 12px; cursor: pointer; border: none; }
  .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 60px 40px; text-align: center; cursor: pointer; background: var(--surface); }
  .score-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  #processingOverlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(5,10,7,0.92); backdrop-filter: blur(8px); flex-direction: column; align-items: center; justify-content: center; }
  .proc-spinner { width: 48px; height: 48px; border: 2px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="noise-grid"></div>

<div id="processingOverlay">
  <div class="proc-spinner"></div>
  <div style="color: var(--teal); font-family: var(--mono); margin-top: 20px;">ANALYZING BEHAVIORAL PATTERNS</div>
</div>

<div class="container">
  <header class="py-8 border-b border-gray-800 mb-8">
    <div class="text-xs uppercase tracking-widest text-green-400 font-mono">QUANTYSYS™ · BEHAVIORAL INTELLIGENCE</div>
    <div class="text-3xl font-extrabold tracking-tight">Nest<span class="text-green-400">IQ</span></div>
  </header>

  <div id="licenseGate">
    <div class="license-box">
      <div class="text-xl font-bold mb-2">Access License Required</div>
      <div class="font-mono text-xs text-gray-500 mb-6">FORMAT: NEST-XXXX-XXXX-XXXX</div>
      <input type="text" class="license-input" id="licenseInput" placeholder="NEST-XXXX-XXXX-XXXX" maxlength="19">
      <div id="licenseError" class="text-red-500 font-mono text-xs mt-3 hidden"></div>
      <button class="btn-primary" onclick="_sys_activate()">ACTIVATE LICENSE</button>
    </div>
  </div>

  <div id="uploadSection" class="hidden">
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <div class="text-4xl text-green-900 mb-4">⬡</div>
      <div class="text-lg font-bold">Drop your bank statement here</div>
      <div class="font-mono text-xs text-gray-500 mt-2">CSV Exports Only · Local Analysis</div>
    </div>
    <input type="file" id="fileInput" accept=".csv" class="hidden">
    <div id="fileSelectedMsg" class="text-center text-green-400 mt-4 font-mono hidden"></div>
    <button id="analyzeBtn" class="btn-primary mt-6 hidden mx-auto w-auto px-10" onclick="_sys_run_analysis()">RUN ANALYSIS</button>
  </div>

  <div id="resultsSection" class="hidden pb-20">
    <div id="scoreHero" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    <button class="btn-primary mt-10 w-auto px-8 mx-auto block bg-transparent border border-green-400 text-green-400" onclick="location.reload()">NEW ANALYSIS</button>
  </div>

  <footer class="mt-20 py-8 border-t border-gray-900 font-mono text-xs text-gray-600">
    <div id="footerDevId">DEVICE ID: COMPUTING...</div>
  </footer>
</div>

<script>
    // Constants
    const _sys_log_offset_ = '_niq_ul_'; 
    const _sys_device_bind_ = '_niq_db_';
    const _MAX_USES_ = 15;
    let _csvData_ = null;
    let _deviceId_ = "NEST-" + Math.random().toString(36).slice(2, 10).toUpperCase();

    // 1. License Check Logic
    function _sys_validate_license_(key) {
        const clean = key.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (clean.length !== 16 || !clean.startsWith('NEST')) return false;
        let sum = 0;
        for (let i = 0; i < 14; i++) { sum += clean.charCodeAt(i) * (i + 1); }
        const check = (sum % 1296).toString(36).toUpperCase().padStart(2, '0');
        return check === clean.slice(-2);
    }

    // 2. Activation Function (Attached to Window for HTML accessibility)
    window._sys_activate = function() {
        const input = document.getElementById('licenseInput').value.trim();
        const err = document.getElementById('licenseError');
        err.classList.add('hidden');

        if (!_sys_validate_license_(input)) {
            err.textContent = "Invalid license key format.";
            err.classList.remove('hidden');
            return;
        }

        // Handle usage checks and local binding
        const usage = localStorage.getItem(_sys_log_offset_) || _MAX_USES_;
        if (parseInt(usage) <= 0) {
            alert("License uses exhausted.");
            return;
        }

        document.getElementById('licenseGate').classList.add('hidden');
        document.getElementById('uploadSection').classList.remove('hidden');
    };

    // 3. Analysis Function
    window._sys_run_analysis = function() {
        document.getElementById('processingOverlay').style.display = 'flex';
        
        setTimeout(() => {
            const rows = _csvData_.split('\n').slice(1);
            const txns = rows.map(r => {
                const c = r.split(',');
                return { desc: c[1] || "", amt: parseFloat(c[2] || 0) };
            }).filter(t => !isNaN(t.amt));

            const leak = Math.abs(txns.filter(t => t.amt < 0 && /AMAZON|UBER|STARBUCKS|SWIGGY|ZOMATO/i.test(t.desc)).reduce((a,b) => a + b.amt, 0));
            
            // Decrement usage
            const current = localStorage.getItem(_sys_log_offset_) || _MAX_USES_;
            localStorage.setItem(_sys_log_offset_, current - 1);

            document.getElementById('scoreHero').innerHTML = `
                <div class="score-card border-l-4 border-red-500">
                    <div class="text-gray-500 text-xs font-mono">ANNUAL BEHAVIORAL LEAK</div>
                    <div class="text-4xl font-bold text-red-500 my-2">$${Math.round(leak * 12).toLocaleString()}</div>
                    <div class="text-xs text-gray-400 font-mono">Estimated yearly friction-loss.</div>
                </div>
                <div class="score-card">
                    <div class="text-gray-500 text-xs font-mono">LENDER SCORE</div>
                    <div class="text-4xl font-bold text-green-400 my-2">${Math.max(40, 100 - txns.length)}</div>
                    <div class="text-xs text-gray-400 font-mono">Risk profile based on txn density.</div>
                </div>
            `;

            document.getElementById('processingOverlay').style.display = 'none';
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
        }, 1200);
    };

    // File Input Listener
    document.getElementById('fileInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
            _csvData_ = ev.target.result;
            document.getElementById('fileSelectedMsg').textContent = `✓ ${f.name} LOADED`;
            document.getElementById('fileSelectedMsg').classList.remove('hidden');
            document.getElementById('analyzeBtn').classList.remove('hidden');
        };
        reader.readAsText(f);
    });

    // Set Device ID on load
    window.onload = () => {
        document.getElementById('footerDevId').textContent = `DEVICE ID: ${_deviceId_}`;
    };
</script>
</body>
</html>
