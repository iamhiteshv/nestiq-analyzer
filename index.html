<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestIQ — Behavioral Alpha Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<script>
    /* CORE LOGIC - PLACED IN HEAD TO PREVENT REFERENCE ERRORS
    */
    const _sys_log_offset_ = '_niq_ul_'; 
    const _MAX_USES_ = 15;
    let _csvData_ = null;

    // License Check Logic
    function _sys_validate_license_(key) {
        const clean = key.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (clean.length !== 16 || !clean.startsWith('NEST')) return false;
        let sum = 0;
        for (let i = 0; i < 14; i++) { sum += clean.charCodeAt(i) * (i + 1); }
        const check = (sum % 1296).toString(36).toUpperCase().padStart(2, '0');
        return check === clean.slice(-2);
    }

    // Activation Function
    function _sys_activate() {
        const input = document.getElementById('licenseInput').value.trim();
        const err = document.getElementById('licenseError');
        
        if (!err) return; // Safety check
        err.style.display = 'none';

        if (!_sys_validate_license_(input)) {
            err.textContent = "Invalid license key format.";
            err.style.display = "block";
            return;
        }

        const usage = localStorage.getItem(_sys_log_offset_) || _MAX_USES_;
        if (parseInt(usage) <= 0) {
            alert("License uses exhausted.");
            return;
        }

        document.getElementById('licenseGate').style.display = 'none';
        document.getElementById('uploadSection').style.display = 'block';
    }

    // Analysis Engine
    function _sys_run_analysis() {
        document.getElementById('processingOverlay').style.display = 'flex';
        
        setTimeout(() => {
            try {
                const rows = _csvData_.split('\n').slice(1);
                const txns = rows.map(r => {
                    const c = r.split(',');
                    return { desc: c[1] || "", amt: parseFloat(c[2] || 0) };
                }).filter(t => !isNaN(t.amt));

                const leak = Math.abs(txns.filter(t => t.amt < 0 && /AMAZON|UBER|STARBUCKS|SWIGGY|ZOMATO/i.test(t.desc)).reduce((a,b) => a + b.amt, 0));
                
                // Track Usage
                const current = localStorage.getItem(_sys_log_offset_) || _MAX_USES_;
                localStorage.setItem(_sys_log_offset_, current - 1);

                document.getElementById('scoreHero').innerHTML = `
                    <div class="p-6 bg-gray-900 rounded-lg border-l-4 border-red-500">
                        <div class="text-gray-500 text-xs font-mono">ANNUAL BEHAVIORAL LEAK</div>
                        <div class="text-3xl font-bold text-red-500 my-2">$${Math.round(leak * 12).toLocaleString()}</div>
                    </div>
                    <div class="p-6 bg-gray-900 rounded-lg border-l-4 border-green-500">
                        <div class="text-gray-500 text-xs font-mono">LENDER SCORE</div>
                        <div class="text-3xl font-bold text-green-400 my-2">${Math.max(45, 100 - txns.length)}</div>
                    </div>
                `;

                document.getElementById('processingOverlay').style.display = 'none';
                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'block';
            } catch(e) {
                alert("Error processing CSV file.");
                document.getElementById('processingOverlay').style.display = 'none';
            }
        }, 1500);
    }
</script>

<style>
    :root { --bg: #050a07; --teal: #00e5a0; --border: #1e3a24; }
    body { background: var(--bg); color: #e8f5ec; font-family: 'Syne', sans-serif; }
    .license-input { background: #080f0a; border: 1px solid var(--border); color: var(--teal); }
    #processingOverlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(5,10,7,0.95); flex-direction: column; align-items: center; justify-content: center; }
</style>
</head>
<body class="p-8">

<div id="processingOverlay">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-400"></div>
    <div class="mt-4 text-green-400 font-mono">ANALYZING...</div>
</div>

<div class="max-w-4xl mx-auto">
    <header class="mb-12 border-b border-gray-800 pb-6">
        <h1 class="text-2xl font-bold">Nest<span class="text-green-400">IQ</span></h1>
    </header>

    <div id="licenseGate" class="max-w-md mx-auto bg-gray-900 p-10 rounded-xl border border-gray-800">
        <h2 class="text-xl font-bold mb-4">Activation Required</h2>
        <input type="text" id="licenseInput" class="license-input w-full p-4 rounded mb-2 font-mono" placeholder="NEST-XXXX-XXXX-XXXX">
        <p id="licenseError" class="text-red-500 text-xs mb-4 hidden"></p>
        <button onclick="_sys_activate()" class="w-full bg-green-500 text-black font-bold p-4 rounded">ACTIVATE</button>
    </div>

    <div id="uploadSection" class="hidden text-center">
        <div class="border-2 border-dashed border-gray-800 p-20 rounded-xl cursor-pointer hover:border-green-400" onclick="document.getElementById('fileInput').click()">
            <p>Click to upload Bank CSV</p>
        </div>
        <input type="file" id="fileInput" class="hidden" accept=".csv">
        <button id="analyzeBtn" onclick="_sys_run_analysis()" class="hidden mt-8 bg-green-500 text-black font-bold px-12 py-4 rounded">RUN ANALYSIS</button>
    </div>

    <div id="resultsSection" class="hidden">
        <div id="scoreHero" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        <button onclick="location.reload()" class="mt-8 text-green-400 border border-green-400 px-6 py-2 rounded">New Analysis</button>
    </div>
</div>

<script>
    /* FILE LISTENER 
    */
    document.getElementById('fileInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
            _csvData_ = ev.target.result;
            document.getElementById('analyzeBtn').style.display = 'inline-block';
        };
        reader.readAsText(f);
    });
</script>

</body>
</html>
