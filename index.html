<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestIQ — Behavioral Alpha Analyzer</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a07; --bg2: #080f0a; --bg3: #0d1a10; --surface: #0f1f13;
    --border: #1e3a24; --teal: #00e5a0; --teal2: #00b87a; --teal3: #007a52;
    --red: #ff4d6d; --amber: #ffb830; --text: #e8f5ec; --text2: #8fad98;
    --text3: #4a6655; --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }
  .noise-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(0,229,160,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,160,0.015) 1px, transparent 1px); background-size: 40px 40px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
  header { padding: 32px 0 24px; border-bottom: 1px solid var(--border); }
  .logo-mark { font-family: var(--mono); font-size: 11px; letter-spacing: 0.25em; color: var(--teal); text-transform: uppercase; }
  .logo-main { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
  .logo-main span { color: var(--teal); }
  .privacy-strip { background: rgba(0,229,160,0.04); border: 1px solid var(--border); border-radius: 6px; padding: 12px 18px; display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .license-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 480px; margin: 60px auto; }
  .license-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; color: var(--teal); font-family: var(--mono); outline: none; text-transform: uppercase; }
  .btn-primary { width: 100%; background: var(--teal); color: var(--bg); font-weight: 700; padding: 14px; border-radius: 6px; margin-top: 12px; cursor: pointer; border: none; transition: 0.2s; }
  .btn-primary:hover { filter: brightness(1.1); }
  .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 60px 40px; text-align: center; cursor: pointer; background: var(--surface); transition: 0.2s; }
  .drop-zone:hover { border-color: var(--teal); background: var(--bg3); }
  .score-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  #processingOverlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(5,10,7,0.92); backdrop-filter: blur(8px); flex-direction: column; align-items: center; justify-content: center; }
  .proc-spinner { width: 48px; height: 48px; border: 2px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="noise-grid"></div>

<div id="processingOverlay">
  <div class="proc-spinner"></div>
  <div style="color: var(--teal); font-family: var(--mono); margin-top: 20px;">ANALYZING BEHAVIORAL PATTERNS</div>
</div>

<div class="container">
  <header>
    <div class="logo-mark">QUANTYSYS™ · BEHAVIORAL INTELLIGENCE</div>
    <div class="logo-main">Nest<span>IQ</span></div>
  </header>

  <div class="privacy-strip">
    <div style="font-size: 18px;">🔒</div>
    <div style="font-family: var(--mono); font-size: 11px; color: var(--text2);">
      <strong>ZERO-TRANSMISSION PROTOCOL ACTIVE.</strong> This tool runs entirely in-browser. 
    </div>
  </div>

  <div id="licenseGate">
    <div class="license-box">
      <div style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Access License Required</div>
      <div style="font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 24px;">FORMAT: NEST-XXXX-XXXX-XXXX</div>
      <input type="text" class="license-input" id="licenseInput" placeholder="NEST-XXXX-XXXX-XXXX" maxlength="19">
      <div id="licenseError" style="color: var(--red); font-family: var(--mono); font-size: 11px; margin-top: 10px; display: none;"></div>
      <button class="btn-primary" onclick="_sys_activate()">ACTIVATE LICENSE</button>
    </div>
  </div>

  <div id="uploadSection" style="display:none;">
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 36px; color: var(--teal3);">⬡</div>
      <div style="font-size: 18px; font-weight: 700; margin: 10px 0;">Drop your bank statement here</div>
      <div style="font-family: var(--mono); font-size: 11px; color: var(--text3);">CSV exports · Analyzes 6 Months</div>
    </div>
    <input type="file" id="fileInput" accept=".csv" style="display:none;">
    <div id="fileSelectedMsg" style="text-align:center; color: var(--teal); margin-top: 15px; font-family: var(--mono); display: none;"></div>
    <div style="text-align: center; margin-top: 20px;">
      <button id="analyzeBtn" class="btn-primary" style="display: none; width: auto; padding: 14px 40px;" onclick="_sys_run_analysis()">RUN BEHAVIORAL ANALYSIS</button>
    </div>
  </div>

  <div id="resultsSection" style="display:none; padding-bottom: 60px;">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="scoreHero"></div>
    <div style="text-align: center; margin-top: 40px;">
        <button class="btn-primary" style="width: auto; padding: 10px 24px; background: transparent; border: 1px solid var(--teal); color: var(--teal);" onclick="location.reload()">NEW ANALYSIS</button>
    </div>
  </div>

  <footer style="margin-top: 40px; padding: 24px 0; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--text3);">
    <div id="footerDevId">DEVICE ID: COMPUTING...</div>
  </footer>
</div>

<script>
    // Global Constants
    const _sys_log_offset_ = '_niq_ul_'; 
    const _MAX_USES_ = 15;
    let _csvData_ = null;

    // 1. Logic Check - Synchronized with sum % 1296
    function _sys_validate_license_(key) {
        const clean = key.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (clean.length !== 16 || !clean.startsWith('NEST')) return false;
        let sum = 0;
        for (let i = 0; i < 14; i++) { sum += clean.charCodeAt(i) * (i + 1); }
        const check = (sum % 1296).toString(36).toUpperCase().padStart(2,'0');
        return check === clean.slice(-2);
    }

    // 2. Activation - Explicitly attached to window to solve ReferenceError
    window._sys_activate = function() {
        const input = document.getElementById('licenseInput').value.trim();
        const err = document.getElementById('licenseError');
        err.style.display = 'none';

        if (!_sys_validate_license_(input)) {
            err.textContent = "Invalid license key format.";
            err.style.display = "block";
            return;
        }

        const usage = localStorage.getItem(_sys_log_offset_) || _MAX_USES_;
        if (parseInt(usage) <= 0) {
            alert("License uses exhausted.");
            return;
        }

        document.getElementById('licenseGate').style.display = 'none';
        document.getElementById('uploadSection').style.display = 'block';
    };

    // 3. Analysis Engine
    window._sys_run_analysis = function() {
        document.getElementById('processingOverlay').style.display = 'flex';
        
        setTimeout(() => {
            const rows = _csvData_.split('\n').slice(1);
            const txns = rows.map(r => {
                const c = r.split(',');
                return { desc: c[1] || "", amt: parseFloat(c[2] || 0) };
            }).filter(t => !isNaN(t.amt));

            const leak = Math.abs(txns.filter(t => t.amt < 0 && /AMAZON|UBER|STARBUCKS|SWIGGY|NETFLIX/i.test(t.desc)).reduce((a,b) => a + b.amt, 0));
            
            // Decrement usage logic
            const current = localStorage.getItem(_sys_log_offset_) || _MAX_USES_;
            localStorage.setItem(_sys_log_offset_, current - 1);

            document.getElementById('scoreHero').innerHTML = `
                <div class="score-card" style="border-left: 4px solid var(--red)">
                    <div style="font-family: var(--mono); font-size: 10px; color: var(--text3)">ANNUAL BEHAVIORAL LEAK</div>
                    <div style="font-size: 32px; font-weight: 800; color: var(--red); margin: 10px 0;">$${Math.round(leak * 12).toLocaleString()}</div>
                    <div style="font-family: var(--mono); font-size: 11px; color: var(--text2)">Estimated annual friction loss</div>
                </div>
                <div class="score-card">
                    <div style="font-family: var(--mono); font-size: 10px; color: var(--text3)">LENDER SCORE</div>
                    <div style="font-size: 32px; font-weight: 800; color: var(--teal); margin: 10px 0;">${Math.max(45, 100 - txns.length)}</div>
                    <div style="font-family: var(--mono); font-size: 11px; color: var(--text2)">Profile risk based on velocity</div>
                </div>
            `;

            document.getElementById('processingOverlay').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
        }, 1500);
    };

    // File Handling
    document.getElementById('fileInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
            _csvData_ = ev.target.result;
            document.getElementById('fileSelectedMsg').textContent = `✓ ${f.name} LOADED`;
            document.getElementById('fileSelectedMsg').style.display = 'block';
            document.getElementById('analyzeBtn').style.display = 'inline-block';
        };
        reader.readAsText(f);
    });

    window.onload = () => {
        const devId = "NEST-" + Math.random().toString(36).slice(2, 10).toUpperCase();
        document.getElementById('footerDevId').textContent = `DEVICE ID: ${devId}`;
    };
</script>
</body>
</html>
